#
# RobotFramework_TestsuitesManagement - pyproject.toml
#
# --------------------------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools==79.0.1", "wheel", "colorama==0.4.6", "pypandoc_binary==1.15", "PythonExtensionsCollection"]
build-backend = "setuptools.build_meta"

[project]
name = "RobotFramework_TestsuitesManagement"
version = "0.8.2"
description = "RobotFramework_TestsuitesManagement"
authors = [
   {name = "Mai Dinh Nam Son", email = "Fixed-term.MaiDinhNamSon@de.bosch.com"}
]
maintainers = [
   {name = "Mai Dinh Nam Son", email = "Fixed-term.MaiDinhNamSon@de.bosch.com"}
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
   "JsonPreprocessor",
   "dotdict",
   "robotframework",
   "robotframework-pythonlibcore",
   "jsonschema",
   "lxml",
   "regex"
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/robotframework-testsuitesmanagement"

[project.scripts]
robfwaio_version = "RobotFramework_TestsuitesManagement.version:robfwaio_version"

[tool.setuptools]
packages = [
   "RobotFramework_TestsuitesManagement",
   "RobotFramework_TestsuitesManagement.Config",
   "RobotFramework_TestsuitesManagement.Keywords",
   "RobotFramework_TestsuitesManagement.Utils",
   "RobotFramework_TestsuitesManagement.Utils.Events"
]

[tool.setuptools.package-data]
RobotFramework_TestsuitesManagement = [
   "*.pdf",
   "Config/*.json",
   "Config/*.jsonp"
]
